name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: flake8 extract/ snowflake_ops/ --max-line-length=120

            - name: Check imports resolve (syntax/module sanity check)
        run: |
          python -c "from extract.config import TABLES, PRIMARY_KEYS; print('extract.config OK')"
          python -c "import ast; ast.parse(open('extract/common.py').read()); print('extract.common syntax OK')"
          python -c "import ast; ast.parse(open('extract/run_all.py').read()); print('extract.run_all syntax OK')"
          python -c "import ast; ast.parse(open('extract/run_table.py').read()); print('extract.run_table syntax OK')"
          python -c "import ast; ast.parse(open('extract/state.py').read()); print('extract.state syntax OK')"
          python -c "import ast; ast.parse(open('snowflake_ops/common.py').read()); print('snowflake_ops.common syntax OK')"
          python -c "import ast; ast.parse(open('snowflake_ops/backfill.py').read()); print('snowflake_ops.backfill syntax OK')"
          python -c "import ast; ast.parse(open('snowflake_ops/dedupe.py').read()); print('snowflake_ops.dedupe syntax OK')"
          python -c "import ast; ast.parse(open('snowflake_ops/dedupe_all.py').read()); print('snowflake_ops.dedupe_all syntax OK')"
          python -c "import ast; ast.parse(open('snowflake_ops/reconcile.py').read()); print('snowflake_ops.reconcile syntax OK')"
          python -c "import ast; ast.parse(open('snowflake_ops/reconcile_all.py').read()); print('snowflake_ops.reconcile_all syntax OK')"